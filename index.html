<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitter Clone</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; }
    form { margin-bottom: 1em; }
    .tweet { border-bottom: 1px solid #ccc; padding: 1em 0; }
    .tweet-user { font-weight: bold; }
    .tweet-content { margin: 0.5em 0; }
    .tweet-date { color: #777; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Twitter Clone</h1>
  <form id="tweet-form">
    <input type="text" id="user" placeholder="User" required />
    <input type="text" id="content" placeholder="What's happening?" required />
    <button type="submit">Tweet</button>
  </form>
  <div id="tweets"></div>

  <script>
    async function fetchTweets() {
      const res = await fetch('/api/tweets');
      const tweets = await res.json();
      const container = document.getElementById('tweets');
      container.innerHTML = '';
      tweets.slice().reverse().forEach(t => {
        const div = document.createElement('div');
        div.className = 'tweet';
        div.innerHTML = `
          <div class="tweet-user">@${t.user}</div>
          <div class="tweet-content">${t.content}</div>
          <div class="tweet-date">${new Date(t.created).toLocaleString()}</div>
        `;
        container.appendChild(div);
      });
    }

    document.getElementById('tweet-form').addEventListener('submit', async e => {
      e.preventDefault();
      const user = document.getElementById('user').value;
      const content = document.getElementById('content').value;
      await fetch('/api/tweets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user, content })
      });
      document.getElementById('content').value = '';
      fetchTweets();
    });

    fetchTweets();
  </script>
</body>
</html>
